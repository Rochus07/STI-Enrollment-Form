<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="stylesheet" type = "text/css" href="style.css">
 <title>Enrollment Form</title>
</head>
<body>

  <form class="form-container">

    <img src="images.jpg" alt="Logo" class="logo">

    <h2>Enrollment Form</h2>  

    <div class="name-row">

      <div class="input-group">
        <label>First Name</label>
        <input type="text" name="firstname" placeholder="First Name">
      </div>

     <div class="input-group">
        <label>Last Name</label>
        <input type="text" name="lastname" placeholder="Last Name">
     </div>

     <div class="input-group">
        <label>Middle Name</label>
        <input type="text" name="middlename" placeholder="Middle Name">
     </div>

    </div>


    <label for="student-number">Student Number:</label>
    <input type="text" id="student-number" name="student-number" placeholder="Student Number">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Email Address">

    <label for="contact">Contact:</label>
    <input type="tel" id="contact" name="contact" placeholder="Phone Number">

    <div class="status">
      <label>Student status:</label>
      <label><input type="radio" name="status" value="Old Student"> Old Student</label>
      <label><input type="radio" name="status" value="New Student"> New Student</label>
      <label><input type="radio" name="status" value="Transfer Student"> Transfer Student</label>

    </div>

    <div class="buttons">
      <button type="submit" class="submit-btn">Submit Form</button>
      <button type="reset" class="reset-btn">Reset</button>
    </div>

  </form>

</body>
</html>
